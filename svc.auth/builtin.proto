syntax = "proto3";
import "google/protobuf/descriptor.proto";


message Config {
  string stage = 1;
  repeated string e = 2;
}
extend google.protobuf.FileOptions {
  repeated Config config = 51237;
}
extend google.protobuf.MethodOptions {
  string api = 51236;
  string using = 51235;
  repeated string secret = 51238;
}
extend google.protobuf.FieldOptions {
  string validation = 51234;
}
message Empty {}
